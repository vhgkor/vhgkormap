<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>My Life Logs</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            font-family: 'Zen Kaku Gothic New', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d0d11; 
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding: 40px 20px;
        }

        /* 玄関全体の背景画像（維持） */
        .portal-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            z-index: -2;
        }

        /* 背景をより深く落とし込むオーバーレイ */
        .portal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(13, 13, 17, 0.85) 0%, rgba(13, 13, 17, 0.95) 100%);
            z-index: -1;
        }

        /* 全体を中央にキュッとまとめるコンパクトなコンテナ */
        .main-container {
            max-width: 480px;
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            padding: 40px 35px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
            box-sizing: border-box;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
        }

        header h1 {
            margin: 0; 
            font-size: 32px; 
            font-weight: 700;
            letter-spacing: 4px;
            color: #ffffff;
        }

        header p {
            margin: 10px 0 0 0; 
            font-family: 'Cormorant Garamond', serif;
            font-size: 16px;  
            font-style: normal; /* イタリックを解除 */
            opacity: 0.5;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* ==========================================
           ★ 著者紹介（プロフィール）セクション
           ========================================== */
        .profile-section {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 25px 5px;
            margin-bottom: 35px;
        }

        /* ★ 追加：名前用のスタイル（太字で少し大きめ） */
        .profile-name {
            font-size: 18px;
            font-weight: 700;
            margin: 0 0 12px 0;
            letter-spacing: 2px;
            color: #ffffff;
        }

        .profile-text {
            font-size: 13px;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.75);
            margin: 0;
            text-align: justify;
        }

        /* ==========================================
           ★ 各コンテンツへのミニマルなナビゲーション
           ========================================== */
        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* 写真を排除した、ソリッドでコンパクトなバー型のリンク */
        .minimal-link {
            position: relative;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: #ffffff;
            /* ぬめっとした慣性のある手触り */
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .link-title {
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        /* 右側の矢印インジケーター */
        .link-arrow {
            font-size: 12px;
            opacity: 0.3;
            transform: translateX(0);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* ホバー時の美しいリアクション */
        .minimal-link:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .minimal-link:hover .link-arrow {
            opacity: 0.8;
            transform: translateX(4px); /* 矢印が右にすっと動く */
        }

        .minimal-link:active {
            transform: scale(0.98);
            background: rgba(255, 255, 255, 0.02);
        }

        @media (max-width: 480px) {
            body { padding: 20px 15px; }
            .main-container { padding: 30px 20px; }
            header h1 { font-size: 26px; }
        }
    </style>
</head>
<body>

    <div class="portal-bg"></div>
    <div class="portal-overlay"></div>

    <div class="main-container">
        <header>
            <h1>ぼくの偏愛図鑑</h1>
            <p>Exploration & Records</p>
        </header>

        <div class="profile-section">
            <p class="profile-name">shtwne</p>
            <p class="profile-text">
                首都圏在住の社会人。
                大学生の頃にコーヒーにハマリ、それから休日には気まぐれに珈琲屋を開拓・訪問し続けている。
                今までに巡ったショップをデータベースとして残したいという思いから、Webページを作成。
                休日の空いた時間を縫ってWeb開発に挑戦中。
                町中華屋巡りや登山やカメラも趣味。こんな雑多で偏愛な人間によるWebページ。
                2025年に訪ねた珈琲屋は60店舗越え（全国チェーン店は除く）。2026年はさらにペースアップ中。
            </p>
        </div>

        <nav class="nav-links">
            <a href="coffee.html" class="minimal-link">
                <span class="link-title">偏愛コーヒー図鑑</span>
                <span class="link-arrow">→</span>
            </a>

            <a href="machichuka.html" class="minimal-link">
                <span class="link-title">偏愛町中華図鑑</span>
                <span class="link-arrow">→</span>
            </a>

            <a href="hiking.html" class="minimal-link">
                <span class="link-title">偏愛登山図鑑</span>
                <span class="link-arrow">→</span>
            </a>
        </nav>
    </div>

</body>
</html>
